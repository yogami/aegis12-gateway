# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/.clinerules"
    - "!**/.cursorrules"
    - "!**/.windsurfrules"
  path_instructions:
    - path: "packages/aegis12-sdk/**"
      instructions: |
        This is a zero-custody TEE SDK. Review for:
        - Any use of 'any' type (must use strict interfaces)
        - Hardcoded URLs, addresses, or credentials
        - Silent fallback defaults (fail-closed is mandatory)
        - Private key exposure or in-memory secret handling
        - Error messages that could enable LLM prompt injection
    - path: "packages/eliza-plugin/**"
      instructions: |
        This is the ElizaOS agent plugin. Review for:
        - Address extraction regex correctness (must use 'to' keyword anchor)
        - Validate function false-positive triggers (word boundary required)
        - Double-callback patterns (only one callback per handler execution)
        - Missing environment variable guards
    - path: "src/**"
      instructions: |
        This is the TEE enclave backend. Review for:
        - Nonce replay attacks
        - Attestation substance verification
        - Circuit breaker state consistency
        - Policy escalation logic (must never hardcode ALLOW)
  review_status: true

chat:
  auto_reply: true
