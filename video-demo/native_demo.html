<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis-12 Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: white; font-family: monospace; }
        .red-marker { border: 5px solid red !important; box-shadow: 0 0 20px red !important; background-color: rgba(255,0,0,0.2) !important; border-radius: 4px; }
        .success-marker { border: 5px solid red !important; animation: pulse 2s infinite; background-color: rgba(0,255,100,0.1) !important; border-radius: 4px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        /* Typing cursor */
        .cursor { animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen relative overflow-hidden">
    <!-- Chrome Header -->
    <div class="w-full bg-neutral-900 border-b border-neutral-800 p-4 flex place-items-center space-x-4 z-50 relative">
        <div class="flex space-x-2">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-amber-500"></div>
            <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
        </div>
        <div class="flex-1 max-w-4xl mx-auto bg-black border border-neutral-800 rounded-md py-2 px-4 text-sm text-neutral-300">
            <span id="urlTarget"></span><span class="cursor">|</span>
        </div>
    </div>

    <!-- Background Gradients -->
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-cyan-900/40 blur-[150px] rounded-full pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-blue-900/40 blur-[150px] rounded-full pointer-events-none"></div>

    <div class="z-10 w-full max-w-4xl flex flex-col items-center mt-12 space-y-8 px-6">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tighter text-center bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500" style="-webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Aegis-12 Security Dashboard
        </h1>

        <!-- Terminal Interface -->
        <div class="w-full mt-4 p-8 bg-neutral-900/80 backdrop-blur-xl border border-neutral-800 rounded-xl shadow-2xl h-96 overflow-y-auto">
            <div id="logContainer" class="flex flex-col space-y-4 text-sm">
                <span id="statusWait" class="text-neutral-600">Waiting for connection...</span>
            </div>
        </div>
    </div>

    <script>
        const urlToType = "https://aegis12-gateway.up.railway.app/live";
        const urlEl = document.getElementById('urlTarget');
        const logsEl = document.getElementById('logContainer');
        const waitEl = document.getElementById('statusWait');
        
        let i = 0;
        const typeLoop = setInterval(() => {
            urlEl.textContent = urlToType.slice(0, i);
            i++;
            if (i > urlToType.length) {
                clearInterval(typeLoop);
                setTimeout(startExecution, 2500);
            }
        }, 50);

        function addLog(text, isError=false, isSuccess=false) {
            waitEl.style.display = 'none';
            const logDiv = document.createElement('div');
            logDiv.className = `p-3 transition-all duration-500 ease-out border-4 border-transparent rounded`;
            
            let colorClass = 'text-neutral-300';
            if(isError) colorClass = 'text-amber-400 font-bold';
            if(isSuccess) colorClass = 'text-emerald-400 font-bold';
            
            logDiv.innerHTML = `<span class="${colorClass}">${text}</span>`;
            logsEl.appendChild(logDiv);
            return logDiv;
        }

        async function startExecution() {
            addLog("🚀 Connecting to Aegis-12 Remote AMD SEV Enclave...", false, true);
            await new Promise(r => setTimeout(r, 2000));
            addLog("📦 Intercepting raw agent transaction intent...");
            
            await new Promise(r => setTimeout(r, 2000));
            addLog("⚠️ [WARN] 5KB TLS Certificate Chain Detached. Exceeds Solana 1232-byte MTU limit.", true);

            await new Promise(r => setTimeout(r, 2500));
            const marker1 = addLog("⚡ Binding Solana Durable Nonce -> Groth16 Off-chain circuit mapper...");
            marker1.classList.add('red-marker'); // The FIRST red marker!

            await new Promise(r => setTimeout(r, 3500));
            addLog("🛡️ Proving Enclave Signature public input constraint...");

            await new Promise(r => setTimeout(r, 2500));
            const marker2 = addLog("✅ SUCCESS! Cryptographic bounds validated natively on Layer-1.", false, true);
            marker2.classList.add('success-marker'); // The SECOND red marker on Result!
            
            const marker3 = addLog("📜 ARS Proof Anchor: aXkL9_zMqop...9Eqp", false, true);
            marker3.classList.add('success-marker');
        }
    </script>
</body>
</html>
