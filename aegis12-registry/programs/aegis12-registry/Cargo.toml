[package]
name = "aegis12-registry"
version = "0.1.0"
description = "Aegis-12 Compliance Registry for EU AI Act Auditor Proofs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis12_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.17"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
