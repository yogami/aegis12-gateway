<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis-12 Fiduciary Firewall Demo</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #38bdf8;
            --success: #4ade80;
            --danger: #f87171;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .header p {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 10px auto;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-valid {
            background-color: var(--primary);
            color: #0f172a;
        }
        .btn-valid:hover:not(:disabled) {
            background-color: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .btn-malicious {
            background-color: var(--surface);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        .btn-malicious:hover:not(:disabled) {
            background-color: rgba(248, 113, 113, 0.1);
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.4);
        }
        .terminal {
            background-color: #000;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }
        .terminal::-webkit-scrollbar {
            width: 8px;
        }
        .terminal::-webkit-scrollbar-track {
            background: #000;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .log-line {
            margin-bottom: 4px;
            word-break: break-all;
        }
        .log-time {
            color: #64748b;
            margin-right: 10px;
        }
        .log-info { color: #e2e8f0; }
        .log-success { color: var(--success); }
        .log-warning { color: #fbbf24; }
        .log-error { color: var(--danger); }
        .log-highlight { color: var(--primary); }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.2);
            color: var(--primary);
            margin-top: 10px;
        }
        
        a {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aegis-12 Gateway</h1>
        <p>Zero-Latency Fiduciary Firewall. Intel TDX Enclave execution natively coupled with Switchboard Oracle whitelisting.</p>
        <div class="status-badge">● TEE SECURE ENCLAVE ACTIVE</div>
    </div>

    <div class="controls">
        <button id="btn-valid" class="btn-valid" onclick="runDemo('valid')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Simulate Valid Trade (0.001 SOL)
        </button>
        <button id="btn-malicious" class="btn-malicious" onclick="runDemo('malicious')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
            Simulate Prompt Injection (1.5 SOL)
        </button>
        <button id="btn-clear" onclick="clearTerminal()" style="background: transparent; border: 1px solid #334155; color: var(--text-dim);">
            Clear
        </button>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-line"><span class="log-info">AEGIS-12 TEE CONSOLE INITIALIZED. WAITING FOR INTENT...</span></div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const btnValid = document.getElementById('btn-valid');
        const btnMalicious = document.getElementById('btn-malicious');
        let currentEventSource = null;

        function clearTerminal() {
            terminal.innerHTML = '<div class="log-line"><span class="log-info">AEGIS-12 TEE CONSOLE INITIALIZED. WAITING FOR INTENT...</span></div>';
        }

        function appendLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'log-line';
            
            const time = new Date().toISOString().split('T')[1].substring(0, 12);
            
            // Format links
            let formattedMessage = message;
            if (message.includes('https://explorer.solana.com')) {
                const urlMatch = message.match(/(https:\/\/explorer\.solana\.com[^\s]+)/);
                if (urlMatch) {
                    formattedMessage = message.replace(urlMatch[0], `<a href="${urlMatch[0]}" target="_blank">${urlMatch[0]}</a>`);
                }
            }

            // Apply color classes based on content if not explicitly provided
            let colorClass = `log-${type}`;
            if (message.includes('✅')) colorClass = 'log-success';
            else if (message.includes('WARNING') || message.includes('ESCALATED')) colorClass = 'log-warning';
            else if (message.includes('ERROR') || message.includes('DENIED') || message.includes('Failed')) colorClass = 'log-error';
            else if (message.includes('>>>') || message.includes('⚡')) colorClass = 'log-highlight';

            div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${formattedMessage}</span>`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function setButtonsDisabled(disabled) {
            btnValid.disabled = disabled;
            btnMalicious.disabled = disabled;
        }

        function runDemo(type) {
            if (currentEventSource) {
                currentEventSource.close();
            }

            setButtonsDisabled(true);
            appendLog(`\n--- STARTING DEMO: ${type.toUpperCase()} ---`, 'highlight');

            currentEventSource = new EventSource(`/api/demo?type=${type}`);

            currentEventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.done) {
                        currentEventSource.close();
                        setButtonsDisabled(false);
                        appendLog(`--- DEMO COMPLETE ---`, 'highlight');
                        return;
                    }
                    
                    appendLog(data.message, 'info');
                } catch (e) {
                    appendLog(event.data, 'info');
                }
            };

            currentEventSource.onerror = function() {
                currentEventSource.close();
                setButtonsDisabled(false);
                appendLog(`Connection to TEE Enclave lost or execution finished.`, 'warning');
            };
        }
    </script>
</body>
</html>
