name: Phala CVM Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore ZK Artifacts Cache
        id: zk-cache
        uses: actions/cache@v3
        with:
          path: zk-artifacts/
          key: ${{ runner.os }}-zk-artifacts-${{ hashFiles('aegis-zk-prover/**') }}
          restore-keys: |
            ${{ runner.os }}-zk-artifacts-

      - name: Cache Cargo and Target (for ZK Prover)
        if: steps.zk-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aegis-zk-prover -> target"
          cache-on-failure: "true"

      - name: Build ZK Prover (If Not Cached)
        if: steps.zk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://risczero.com/install | bash
          ~/.risc0/bin/rzup install rust
          ~/.risc0/bin/rzup install cargo-risczero
          export PATH="/home/runner/.risc0/bin:/home/runner/.cargo/bin:${PATH}"
          cd aegis-zk-prover
          cargo build --release
          cd ..
          mkdir -p zk-artifacts
          cp aegis-zk-prover/target/release/host zk-artifacts/aegis-zk-prover
          cp -r ~/.risc0 zk-artifacts/.risc0

      - name: Build and Push Phala CVM Image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.phala_cvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm:latest
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Phala Cloud Hardware Update (Provision & Submit)
        run: |
          CVM_ID="cvm_D6gWka68"
          IMAGE_DIGEST="${{ steps.docker_build.outputs.digest }}"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm"
          
          echo "Step 1: Provisioning new configuration for CVM $CVM_ID with digest $IMAGE_DIGEST..."
          
          COMPOSE_WITH_DIGEST=$(cat <<EOF
          version: '3.8'
          services:
            aegis12-tee:
              image: $IMAGE_NAME@$IMAGE_DIGEST
              ports:
                - "8000:8000"
              environment:
                - TEE_ENV=phala
                - NODE_ENV=production
                - AUTHORIZED_TENANTS={"tenant-001":["0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"]}
                - SOLANA_PAYER_SECRET=${{ secrets.SOLANA_PAYER_SECRET }}
              volumes:
                - /var/run/dstack.sock:/var/run/dstack.sock
          EOF
          )
          
          PROVISION_PAYLOAD=$(jq -n \
            --arg name "aegis12-gateway" \
            --arg compose "$COMPOSE_WITH_DIGEST" \
            '{
              name: $name,
              docker_compose_file: $compose,
              runner: "docker-compose",
              manifest_version: 2,
              kms_enabled: true,
              gateway_enabled: true,
              public_logs: true,
              public_sysinfo: true,
              public_tcbinfo: true
            }')
          
          PROVISION_RES=$(curl -s -X POST "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/compose_file/provision" \
               -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "$PROVISION_PAYLOAD")
          
          COMPOSE_HASH=$(echo $PROVISION_RES | jq -r '.compose_hash')
          
          if [ "$COMPOSE_HASH" == "null" ] || [ -z "$COMPOSE_HASH" ]; then
            echo "❌ Error: Provision failed. Response: $PROVISION_RES"
            exit 1
          fi
          
          echo "Step 2: Submitting update with NEW Compose Hash $COMPOSE_HASH..."
          SUBMIT_RES=$(curl -s -X PATCH "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/compose_file" \
               -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "{\"compose_hash\": \"$COMPOSE_HASH\"}")
          
          echo "Submit Response: $SUBMIT_RES"

          echo "Step 3: Triggering Force Restart with Retry Logic..."
          for i in {1..5}; do
            echo "Attempt $i: Requesting Force Restart..."
            RESTART_RES=$(curl -s -X POST "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/restart" \
                 -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
                 -H "Content-Type: application/json" \
                 -d "{\"force\": true}")
            
            echo "Restart Response: $RESTART_RES"
            
            if [[ "$RESTART_RES" == *"Another operation is already in progress"* ]]; then
              echo "⚠️ CVM is busy. Waiting 30s before retry..."
              sleep 30
            elif [[ "$RESTART_RES" == *"null"* ]] || [[ -z "$RESTART_RES" ]]; then
              echo "✅ Restart command accepted (received null/empty success)."
              break
            else
              echo "✅ Restart initiated successfully."
              break
            fi
          done

      - name: Install verification dependencies
        run: npm install ethers tsx @solana/web3.js

      - name: Verify Live Deployment (Substance Audit)
        run: |
          ENCLAVE_URL="https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network"
          
          echo "Waiting for old container to terminate (expecting non-200)..."
          for i in {1..30}; do
            RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ENCLAVE_URL/health" || echo "000")
            if [ "$RESPONSE_CODE" != "200" ]; then
              echo "Old container is down (HTTP $RESPONSE_CODE)."
              break
            fi
            echo "Old container still responding (HTTP $RESPONSE_CODE). Sleeping 5s..."
            sleep 5
          done
          
          echo "Waiting for new hardware enclave to boot and deploy Target SHA: ${{ github.sha }}..."
          MAX_RETRIES=90
          RETRY_COUNT=0
          TARGET_SHA="${{ github.sha }}"
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HEALTH_JSON=$(curl -s "$ENCLAVE_URL/health" || echo "{}")
            COMMIT_HASH=$(echo "$HEALTH_JSON" | jq -r '.commit_hash // "unknown"')
            
            if [ "$COMMIT_HASH" == "$TARGET_SHA" ]; then
              echo "✅ Enclave Gateway is LIVE running Target SHA: $TARGET_SHA."
              break
            fi

            
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES: Enclave not ready (HTTP $RESPONSE_CODE). Sleeping 10s..."
            sleep 10
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Error: Enclave failed to boot within 5 minutes."
            exit 1
          fi

          echo "Running Deep Substance Audit (Solana + ZK + TEE)..."
          npx tsx scripts/verify_substance.ts "$ENCLAVE_URL"
