name: Phala CVM Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Phala CVM Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.phala_cvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm:v1,${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm:latest
          
      - name: Deployment Success Notification
        run: echo "🎉 Phala Network CVM Image built and pushed successfully! Ready for Intel SGX Dashboard ingestion."
