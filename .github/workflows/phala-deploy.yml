name: Phala CVM Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Phala CVM Image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.phala_cvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm:latest

      - name: Trigger Phala Cloud Hardware Update (Provision & Submit)
        run: |
          CVM_ID="cvm_D6gWka68"
          IMAGE_DIGEST="${{ steps.docker_build.outputs.digest }}"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm"
          
          echo "Step 1: Provisioning new configuration for CVM $CVM_ID with digest $IMAGE_DIGEST..."
          
          # Construct Docker Compose with the specific digest to force a new hash
          COMPOSE_WITH_DIGEST=$(cat <<EOF
          version: '3.8'
          services:
            aegis12-tee:
              image: $IMAGE_NAME@$IMAGE_DIGEST
              ports:
                - "8000:8000"
          EOF
          )
          
          PROVISION_PAYLOAD=$(jq -n \
            --arg name "aegis12-gateway" \
            --arg compose "$COMPOSE_WITH_DIGEST" \
            '{
              name: $name,
              docker_compose_file: $compose,
              runner: "docker-compose",
              manifest_version: 2,
              kms_enabled: true,
              gateway_enabled: true,
              public_logs: true,
              public_sysinfo: true,
              public_tcbinfo: true
            }')
          
          PROVISION_RES=$(curl -s -X POST "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/compose_file/provision" \
               -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "$PROVISION_PAYLOAD")
          
          COMPOSE_HASH=$(echo $PROVISION_RES | jq -r '.compose_hash')
          
          if [ "$COMPOSE_HASH" == "null" ] || [ -z "$COMPOSE_HASH" ]; then
            echo "❌ Error: Provision failed. Response: $PROVISION_RES"
            exit 1
          fi
          
          echo "Step 2: Submitting update with NEW Compose Hash $COMPOSE_HASH..."
          SUBMIT_RES=$(curl -s -X PATCH "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/compose_file" \
               -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "{\"compose_hash\": \"$COMPOSE_HASH\"}")
          
          echo "Submit Response: $SUBMIT_RES"

      - name: Verify Live Deployment
        run: |
          echo "Waiting for hardware enclave to pull image and boot (180s)..."
          sleep 180
          RESPONSE=$(curl -s -X POST https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network/enforce -d '{"action":"verify"}' -H "Content-Type: application/json")
          echo "Enclave Response: $RESPONSE"
          if [[ "$RESPONSE" == *"v1.0.1-unmocked"* ]]; then
            echo "✅ VERIFIED: Hardware enclave is now running the LATEST unmocked code!"
          else
            echo "❌ FAILURE: Enclave is still running old code or is offline. Please check Phala Cloud logs."
            exit 1
          fi
