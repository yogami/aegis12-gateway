name: Phala CVM Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Phala CVM Image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.phala_cvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm:latest

      - name: Trigger Phala Cloud Hardware Update (Provision & Submit)
        run: |
          CVM_ID="cvm_D6gWka68"
          IMAGE_DIGEST="${{ steps.docker_build.outputs.digest }}"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm"
          
          echo "Step 1: Provisioning new configuration for CVM $CVM_ID with digest $IMAGE_DIGEST..."
          
          COMPOSE_WITH_DIGEST=$(cat <<EOF
          version: '3.8'
          services:
            aegis12-tee:
              image: $IMAGE_NAME@$IMAGE_DIGEST
              ports:
                - "8000:8000"
              environment:
                - TEE_ENV=phala
                - NODE_ENV=production
                - AUTHORIZED_TENANTS={"tenant-001":["0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"]}
              volumes:
                - /var/run/dstack.sock:/var/run/dstack.sock
          EOF
          )
          
          PROVISION_PAYLOAD=$(jq -n \
            --arg name "aegis12-gateway" \
            --arg compose "$COMPOSE_WITH_DIGEST" \
            '{
              name: $name,
              docker_compose_file: $compose,
              runner: "docker-compose",
              manifest_version: 2,
              kms_enabled: true,
              gateway_enabled: true,
              public_logs: true,
              public_sysinfo: true,
              public_tcbinfo: true
            }')
          
          PROVISION_RES=$(curl -s -X POST "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/compose_file/provision" \
               -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "$PROVISION_PAYLOAD")
          
          COMPOSE_HASH=$(echo $PROVISION_RES | jq -r '.compose_hash')
          
          if [ "$COMPOSE_HASH" == "null" ] || [ -z "$COMPOSE_HASH" ]; then
            echo "❌ Error: Provision failed. Response: $PROVISION_RES"
            exit 1
          fi
          
          echo "Step 2: Submitting update with NEW Compose Hash $COMPOSE_HASH..."
          SUBMIT_RES=$(curl -s -X PATCH "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/compose_file" \
               -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "{\"compose_hash\": \"$COMPOSE_HASH\"}")
          
          echo "Submit Response: $SUBMIT_RES"

          echo "Step 3: Triggering Force Restart with Retry Logic..."
          for i in {1..5}; do
            echo "Attempt $i: Requesting Force Restart..."
            RESTART_RES=$(curl -s -X POST "https://cloud-api.phala.com/api/v1/cvms/$CVM_ID/restart" \
                 -H "X-API-Key: ${{ secrets.PHALA_CLOUD_API_KEY }}" \
                 -H "Content-Type: application/json" \
                 -d "{\"force\": true}")
            
            echo "Restart Response: $RESTART_RES"
            
            if [[ "$RESTART_RES" == *"Another operation is already in progress"* ]]; then
              echo "⚠️ CVM is busy. Waiting 30s before retry..."
              sleep 30
            elif [[ "$RESTART_RES" == *"null"* ]] || [[ -z "$RESTART_RES" ]]; then
              echo "✅ Restart command accepted (received null/empty success)."
              break
            else
              echo "✅ Restart initiated successfully."
              break
            fi
          done

      - name: Install verification dependencies
        run: npm install ethers tsx

      - name: Verify Live Deployment
        run: |
          echo "Waiting for hardware enclave to boot (Polling)..."
          ENCLAVE_URL="https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network/"
          MAX_RETRIES=30
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ENCLAVE_URL" || echo "000")
            if [ "$RESPONSE_CODE" != "000" ]; then
              echo "✅ Enclave Gateway is LIVE (HTTP $RESPONSE_CODE). Proceeding to cryptographic verification..."
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES: Enclave not ready yet. Sleeping 10s..."
            sleep 10
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Error: Enclave failed to boot within 5 minutes."
            exit 1
          fi
          
          echo "Generating Dynamic EIP-712 Verification Payload..."
          cat <<'EOF' > generate_payload.ts
          import { ethers } from 'ethers';

          async function main() {
            const privateKey = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80";
            const wallet = new ethers.Wallet(privateKey);
            const nonce = "n-" + Date.now();
            
            const domain = {
              name: "Aegis-12-Compliance-Matrix",
              version: "1.0.0",
              chainId: 1399811149,
              verifyingContract: "0x1111111111111111111111111111111111111111"
            };

            const types = {
              Policy: [
                { name: 'policyId', type: 'string' },
                { name: 'tenantId', type: 'string' },
                { name: 'version', type: 'string' },
                { name: 'chainId', type: 'uint256' },
                { name: 'crossChainTarget', type: 'string' },
                { name: 'maxAnomalyScore', type: 'uint256' },
                { name: 'financialLimitsString', type: 'string' },
                { name: 'expiresAt', type: 'uint256' },
                { name: 'nonce', type: 'string' }
              ]
            };

            const policyConfig = {
              policyId: "p-test-001",
              tenantId: "tenant-001",
              version: "1.0.0",
              chainId: 1399811149,
              crossChainTarget: "solana:devnet",
              maxAnomalyScore: 100,
              financialLimitsString: "{\"T4\":1000000}",
              expiresAt: Math.floor(Date.now() / 1000) + 3600,
              nonce: nonce
            };

            const signature = await wallet._signTypedData(domain, types, policyConfig);

            const payload = {
              agent: {
                did: "did:solana:agent-001",
                purpose: "financial_operations",
                currentTier: "T4"
              },
              action: {
                toolId: "solana_transfer",
                actionType: "transfer",
                parameters: {
                  to: "ReceiverPublicAddress",
                  amount: "100"
                }
              },
              context: {
                sessionId: "s-test-" + Date.now(),
                actionsThisSession: 1,
                actionsThisHour: 1,
                currentAnomalyScore: 0.1,
                recentIncidents: 0
              },
              dynamicPolicy: {
                policyConfig,
                ownerPublicKey: wallet.address,
                signature
              }
            };

            console.log(JSON.stringify(payload));
          }

          main();
          EOF

          VALID_PAYLOAD=$(npx tsx generate_payload.ts)

          echo "Sending Cryptographically Validated Enforcement Request..."
          RESPONSE=$(curl -s --max-time 30 -X POST https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network/enforce \
            -d "$VALID_PAYLOAD" \
            -H "Content-Type: application/json")
          
          echo "Enclave Response: $RESPONSE"
          
          if [[ "$RESPONSE" == *"approved"* ]] && [[ "$RESPONSE" == *"ars_anchor"* ]]; then
            echo "✅ VERIFIED: Hardware enclave is now FULLY OPERATIONAL with ZK-SEALED ATTESTATIONS!"
          else
            echo "❌ FAILURE: Enclave failed to produce a valid ZK-sealed approved response. Check logs."
            exit 1
          fi
