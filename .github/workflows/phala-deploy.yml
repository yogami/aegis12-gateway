name: Phala CVM Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Phala CVM Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.phala_cvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aegis-phala-cvm:latest

      - name: Trigger Phala Cloud Update (v1 API)
        run: |
          APP_ID="c27b0861a2bf2891f43f3556d3aa9526d704f7bc"
          echo "Fetching latest revision for App $APP_ID..."
          
          # Get the latest revision ID
          REVISIONS=$(curl -s -H "X-API-Key: ${{ secrets.PHALA_DEPLOY_TOKEN }}" \
                      "https://cloud-api.phala.com/api/v1/apps/$APP_ID/revisions")
          
          REVISION_ID=$(echo $REVISIONS | jq -r '.revisions[0].id')
          
          if [ "$REVISION_ID" == "null" ] || [ -z "$REVISION_ID" ]; then
            echo "❌ Error: Could not fetch Revision ID. API Response: $REVISIONS"
            exit 1
          fi
          
          echo "Triggering redeploy for Revision $REVISION_ID..."
          
          curl -i -X POST "https://cloud-api.phala.com/api/v1/apps/$APP_ID/revisions/$REVISION_ID/redeploy" \
               -H "X-API-Key: ${{ secrets.PHALA_DEPLOY_TOKEN }}" \
               -H "Content-Type: application/json"

      - name: Verify Live Deployment
        run: |
          echo "Waiting for enclave to reboot (90s)..."
          sleep 90
          RESPONSE=$(curl -s -X POST https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network/enforce -d '{"action":"verify"}' -H "Content-Type: application/json")
          echo "Enclave Response: $RESPONSE"
          if [[ "$RESPONSE" == *"v1.0.1-unmocked"* ]]; then
            echo "✅ VERIFIED: New unmocked code is live in hardware!"
          else
            echo "❌ FAILURE: Enclave is still running old code or is offline."
            exit 1
          fi
