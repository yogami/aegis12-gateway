name: Aegis-12 High-Veracity Chaos Protocol

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  blackbox-chaos-audit:
    name: Autonomous E2E Blackbox Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install Dependencies
        run: |
          cd packages/telemetry-shield
          npm install

      - name: Unleash Blackbox E2E Chaos Engine
        run: |
          cd packages/telemetry-shield
          npm run build
          npm test
