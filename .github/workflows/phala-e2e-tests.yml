name: Aegis-12 Phala Live Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-phala-deployment:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for Phala Deployment
        env:
          PHALA_CLOUD_URL: 'https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network'
        run: |
          echo "Waiting for Phala CVM Deployment to propagate..."
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # The health endpoint or evidence endpoint
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PHALA_CLOUD_URL/health" || echo "000")
            if [ "$HTTP_STATUS" == "200" ] || [ "$HTTP_STATUS" == "404" ] || [ "$HTTP_STATUS" == "402" ]; then
              echo "Phala CVM is online (Status: $HTTP_STATUS)!"
              break
            fi
            echo "Attempt $RETRY_COUNT failed. Retrying in 10s..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Timeout waiting for Phala deployment"
            exit 1
          fi

      - name: Execute Test Suites against Live Phala Environment
        env:
          PHALA_CLOUD_URL: 'https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network'
        run: |
          echo "Running full automated compliance testing matrix against Phala..."
          export TEST_API_URL="$PHALA_CLOUD_URL"
          npx vitest run tests/e2e/AegisPEP.e2e.spec.ts
          npx vitest run tests/chaos.spec.ts
          npx playwright test e2e/evidence_substance.spec.ts
          npx tsx scripts/aegis12_venture_demo.ts
