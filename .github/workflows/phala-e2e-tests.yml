name: Aegis-12 Phala Live Tests

on:
  workflow_run:
    workflows: ["Phala CVM Deployment"]
    types:
      - completed
  workflow_dispatch:

jobs:
  test-phala-deployment:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Wait for Phala Deployment
        env:
          PHALA_CLOUD_URL: 'https://c2fa9527475ea371388de812f47be1676bc59712-8000.dstack-pha-prod9.phala.network'
        run: |
          echo "Waiting for Phala CVM Deployment to propagate..."
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # The health endpoint or evidence endpoint
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PHALA_CLOUD_URL/health" || echo "000")
            if [ "$HTTP_STATUS" == "200" ] || [ "$HTTP_STATUS" == "404" ] || [ "$HTTP_STATUS" == "402" ]; then
              echo "Phala CVM is online (Status: $HTTP_STATUS)!"
              break
            fi
            echo "Attempt $RETRY_COUNT failed. Retrying in 10s..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Timeout waiting for Phala deployment"
            exit 1
          fi

      - name: E2E PEP Enforcement Suite
        env:
          PHALA_CLOUD_URL: 'https://c2fa9527475ea371388de812f47be1676bc59712-8000.dstack-pha-prod9.phala.network'
        run: |
          export TEST_API_URL="$PHALA_CLOUD_URL"
          npx vitest run tests/e2e/AegisPEP.e2e.spec.ts

      - name: Chaos Engineering Resilience Suite
        env:
          PHALA_CLOUD_URL: 'https://c2fa9527475ea371388de812f47be1676bc59712-8000.dstack-pha-prod9.phala.network'
        run: |
          export TEST_API_URL="$PHALA_CLOUD_URL"
          npx vitest run tests/chaos.spec.ts

      - name: Playwright Compliance Suite (Substance Audit)
        env:
          PHALA_CLOUD_URL: 'https://c2fa9527475ea371388de812f47be1676bc59712-8000.dstack-pha-prod9.phala.network'
          SOLANA_PAYER_SECRET: ${{ secrets.SOLANA_PAYER_SECRET }}
        run: |
          export TEST_API_URL="$PHALA_CLOUD_URL"
          npx playwright test e2e/evidence_substance.spec.ts

      - name: Master Venture Demo Sequence
        env:
          PHALA_CLOUD_URL: 'https://c2fa9527475ea371388de812f47be1676bc59712-8000.dstack-pha-prod9.phala.network'
        run: |
          export TEST_API_URL="$PHALA_CLOUD_URL"
          npx tsx scripts/aegis12_venture_demo.ts
