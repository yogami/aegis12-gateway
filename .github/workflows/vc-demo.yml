name: Aegis-12 Master VC Demo

on:
  workflow_dispatch:
    inputs:
      PHALA_CLOUD_URL:
        description: 'Your physical Phala Cloud CVM Instance Proxy URL (optional)'
        required: false
        type: string

jobs:
  execute-demo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Native Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Synchronize Master Environment Dependencies
        run: |
          npm ci
          cd packages/telemetry-shield
          npm ci

      - name: Execute Cryptographic Thesis Matrix
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          PHALA_CLOUD_URL: ${{ github.event.inputs.PHALA_CLOUD_URL }}
        run: |
          npx tsx scripts/aegis12_venture_demo.ts
