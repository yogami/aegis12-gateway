name: Aegis-12 Master VC Demo

on:
  workflow_dispatch: # Allows manual trigger directly from the GitHub UI natively

jobs:
  execute-demo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Native Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Synchronize Master Environment Dependencies
        run: |
          npm ci
          cd packages/telemetry-shield
          npm ci

      - name: Execute Cryptographic Thesis Matrix
        run: |
          npx tsx scripts/aegis12_venture_demo.ts
