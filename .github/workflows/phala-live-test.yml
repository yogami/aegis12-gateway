name: Phala Live Deployment Verification

on:
  workflow_run:
    workflows: ["Phala TEE Deployment (GHCR)"]
    types:
      - completed

jobs:
  smoke-test-live-hardware:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Phala TEE to pull image and boot (30s)
        run: sleep 30
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run Live Verification UI Tests
        run: |
          echo "Hitting the live Phala Demo Console endpoint using Playwright..."
          
          if [ -z "${{ secrets.PHALA_IP_ADDRESS }}" ]; then
            echo "⚠️ PHALA_IP_ADDRESS secret is not set. Skipping live hardware UI test."
            exit 0
          fi
          
          # Pass the IP address to the test via environment variable
          export TEST_API_URL=${{ secrets.PHALA_IP_ADDRESS }}
          export SOLANA_PAYER_SECRET=${{ secrets.SOLANA_PAYER_SECRET }}
          
          echo "Running Data Plane UI Playwright tests..."
          npx playwright test e2e/demo_ui.spec.ts
          
          echo "Running Hardware Cryptographic Substance tests..."
          npx playwright test e2e/evidence_substance.spec.ts
          
          echo "Running Institutional Feature Verification tests..."
          npx playwright test e2e/institutional_features.spec.ts
