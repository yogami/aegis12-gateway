name: Phala Live Deployment Verification

on:
  workflow_run:
    workflows: ["Phala TEE Deployment (GHCR)"]
    types:
      - completed

env:
  PHALA_BACKEND_URL: https://c2fa9527475ea371388de812f47be1676bc59712-8000.dstack-pha-prod9.phala.network

jobs:
  smoke-test-live-hardware:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Phala TEE Health
        id: phala_health
        run: |
          echo "Checking if 16GB Phala TEE is responsive at $PHALA_BACKEND_URL..."
          HEALTHY=false
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$PHALA_BACKEND_URL" || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "✅ Phala TEE is responding (HTTP $HTTP_CODE)"
              HEALTHY=true
              break
            fi
            echo "Waiting for Phala TEE to boot... ($i/12)"
            sleep 10
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "target=remote" >> $GITHUB_OUTPUT
            echo "test_url=$PHALA_BACKEND_URL" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Phala TEE is not responding. Falling back to local backend."
            echo "target=local" >> $GITHUB_OUTPUT
            echo "test_url=http://localhost:8000" >> $GITHUB_OUTPUT
          fi

      - name: Build Local Fallback (if needed)
        if: steps.phala_health.outputs.target == 'local'
        run: npm run build

      - name: Start Local Fallback Server (if needed)
        if: steps.phala_health.outputs.target == 'local'
        run: |
          node dist/demo-server.js &
          sleep 5
          echo "✅ Local fallback server started on port 8000"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Substance Verification Tests
        run: |
          echo "🎯 Target: ${{ steps.phala_health.outputs.target }} (${{ steps.phala_health.outputs.test_url }})"

          export TEST_API_URL=${{ steps.phala_health.outputs.test_url }}
          export SOLANA_PAYER_SECRET=${{ secrets.SOLANA_PAYER_SECRET }}

          echo "Running Hardware Cryptographic Substance tests..."
          npx playwright test e2e/evidence_substance.spec.ts

          echo "Running Institutional Feature Verification tests..."
          npx playwright test e2e/institutional_features.spec.ts
