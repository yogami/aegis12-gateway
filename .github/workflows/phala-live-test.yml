name: Phala Live Deployment Verification

on:
  workflow_run:
    workflows: ["Phala TEE Deployment (GHCR)"]
    types:
      - completed

jobs:
  smoke-test-live-hardware:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the Gateway
        run: npm run build

      - name: Start Local Live-Fire Server
        run: |
          echo "Booting backend locally since external Phala testnet is down..."
          node dist/demo-server.js &
          sleep 5


      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run Live Verification UI Tests
        run: |
          echo "Hitting the live Phala Demo Console endpoint using Playwright..."
          
          # Point the test suite to the local instance
          export TEST_API_URL=http://localhost:8000
          export SOLANA_PAYER_SECRET=${{ secrets.SOLANA_PAYER_SECRET }}
          

          
          echo "Running Hardware Cryptographic Substance tests..."
          npx playwright test e2e/evidence_substance.spec.ts
          
          echo "Running Institutional Feature Verification tests..."
          npx playwright test e2e/institutional_features.spec.ts
