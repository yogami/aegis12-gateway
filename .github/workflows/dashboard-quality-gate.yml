name: Dashboard Quality Gate 🛡️

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/dashboard/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/dashboard/**'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect Project Type
        id: detect
        run: |
          if [ -f "package.json" ]; then echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then echo "type=python" >> $GITHUB_OUTPUT
          else echo "type=unknown" >> $GITHUB_OUTPUT; fi
      
      # === Node.js Projects ===
      - name: Setup Node
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'
      
      - name: Install Dependencies (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm ci || npm install
      
      - name: TypeScript Check
        if: steps.detect.outputs.type == 'node'
        run: |
          if grep -q '"typescript"' package.json 2>/dev/null || [ -f "tsconfig.json" ]; then
            echo "🔍 Running TypeScript check..."
            npx tsc --noEmit
          else
            echo "⏭️ No TypeScript detected, skipping"
          fi
      
      - name: Lint Check
        if: steps.detect.outputs.type == 'node'
        run: |
          if grep -q '"lint"' package.json 2>/dev/null; then
            echo "🔍 Running lint..."
            npm run lint
          else
            echo "⏭️ No lint script, skipping"
          fi
      
      - name: Run Tests
        if: steps.detect.outputs.type == 'node'
        run: |
          if grep -q '"test"' package.json 2>/dev/null; then
            echo "🧪 Running tests..."
            npm test
          else
            echo "⏭️ No test script, skipping"
          fi
      
      - name: Quality Gate Summary
        run: |
          echo "✅ Dashboard Quality Gate passed!"
