name: Master Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Code Quality & Logic Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Security Audit
      run: npm audit || true

    - name: Run Linter
      run: npx eslint .

    - name: Run Unit Tests (Logic Verification)
      run: npx vitest run tests/unit

    - name: Run Unmocked E2E Tests (HOTL & Substance Verification)
      run: npx vitest run tests/e2e/fiduciary_hotl.e2e.spec.ts tests/e2e/attestation_substance.e2e.spec.ts
      env:
        SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        SOLANA_PAYER_SECRET: ${{ secrets.SOLANA_PAYER_SECRET }}

    - name: Run Institutional Policy Engine + Multi-Oracle + Bypass Attack Tests
      run: npx vitest run tests/e2e/institutional_policy.e2e.spec.ts

  dast-pentest:
    name: DAST Pentest (Demo Console)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the Gateway
        run: npm run build

      - name: Start Demo Console Server
        run: |
          node dist/demo-server.js &
          sleep 5

      - name: Install Load Tester (oha)
        run: cargo install oha

      - name: Perform Concurrent Spam Attack (DAST)
        run: |
          echo "Simulating 100 concurrent requests to the execution endpoint..."
          oha -n 100 -c 50 http://localhost:8000/api/demo?type=valid > load_test_results.txt
          
          if grep -q "\[429\]" load_test_results.txt; then
            echo "✅ DAST PASS: Rate limiter successfully blocked the DDoS attempt. Devnet wallet is secure."
            exit 0
          else
            echo "❌ DAST FAIL: Rate limiter did not engage."
            cat load_test_results.txt
            exit 1
          fi

  chaos-engineering:
    name: Chaos Resilience Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Chaos Tests
        run: npx vitest run tests/e2e/chaos_resilience.spec.ts
