name: Colosseum Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Security Audit
      run: npm audit || true # Optional: fail if you want strict security, otherwise just warn

    - name: Run Linter
      run: npx eslint .

    - name: Run Unit Tests (Logic Verification)
      run: npx vitest run tests/unit

    - name: Run Unmocked E2E Tests (HOTL & Substance Verification)
      run: npx vitest run tests/e2e/fiduciary_hotl.e2e.spec.ts tests/e2e/attestation_substance.e2e.spec.ts
      env:
        SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        SOLANA_PAYER_SECRET: ${{ secrets.SOLANA_PAYER_SECRET }}
