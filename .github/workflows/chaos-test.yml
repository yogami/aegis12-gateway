name: Chaos Stress Tests (Post-Deployment)

on:
  workflow_dispatch:
    inputs:
      enclave_url:
        description: 'Enclave URL to test against'
        required: false
        default: 'https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network'
  workflow_run:
    workflows: ["Phala CVM Deployment"]
    types:
      - completed

jobs:
  chaos-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install ethers tsx @solana/web3.js

      - name: Run Chaos OOM Bomb
        run: npx tsx scripts/chaos_oom_bomb.ts "${{ github.event.inputs.enclave_url || 'https://c27b0861a2bf2891f43f3556d3aa9526d704f7bc-8000.dstack-pha-prod5.phala.network' }}"
